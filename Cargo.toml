[package]
name = "agy-tool"
version = "1.0.0"
edition = "2021"
description = "Antigravity (Gemini 4 Argon) System Prompt Surgical Patcher, 1M Context Unlocker & Composer HUD Toolbox"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
